# EC2에 /etc/nginx/sites-available/lojipsa-api 로 저장 후
# /etc/nginx/sites-enabled/에 심볼릭 링크 걸고 사용.
# api.YOUR_DOMAIN 부분을 실제 도메인으로 바꿔주세요 (예: api.lojipsa.com).
# 이 파일은 certbot이 SSL 설정을 자동으로 덧붙이기 전 상태(HTTP만)입니다 —
# `sudo certbot --nginx -d api.YOUR_DOMAIN`을 실행하면 443/SSL 블록이 자동 추가됩니다.

server {
    listen 80;
    server_name api.YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
