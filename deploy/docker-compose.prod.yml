# EC2 서버에서 사용. 리포를 클론한 뒤 backend/.env.prod (아래 .env.prod.example 참고)를
# 채우고 이 파일 기준으로 실행: docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.prod
    ports:
      - "8080:8080"
    volumes:
      # PriceHistoryStore가 쓰는 data/price-history.json을 호스트에 마운트해서,
      # docker compose up --build로 컨테이너를 재생성해도 가격 추적 이력이 유지되게 한다.
      - ./data:/app/data
