spring:
  application:
    name: loajipsa
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/lojipsa;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 솔로 프로젝트 단계라 엔티티 변경 시 스키마 자동 반영. 나중에 데이터 중요해지면 Flyway로 교체.
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

slack:
  bot-token: ${SLACK_BOT_TOKEN}
  channel: ${SLACK_CHANNEL:#로아-숙제-알림}

lostark:
  api-key: ${LOSTARK_API_KEY}
  base-url: https://developer-lostark.game.onstove.com
  price-change-threshold-percent: 5.0
  watch-items:
    - name: "정제된 파괴강석"
      code: 66102005
    - name: "정제된 수호강석"
      code: 66102105

events:
  watched-categories:
    - "모험 섬"
    - "카오스게이트"
    - "필드보스"
    - "항해"
  reminder-minutes-before: 10

notice:
  watched-types:
    - "공지"
    - "점검"
  max-content-chars: 3000

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

schedule:
  homework-reminder-cron: "0 0 6 * * *"
  market-check-cron: "0 */30 * * * *"
  # market-check-cron과 동일한 주기를 초 단위로도 들고 있는다 (프론트 카운트다운용).
  # cron을 바꾸면 이 값도 같이 바꿔야 한다.
  market-check-interval-seconds: 1800
  event-check-cron: "0 * * * * *"
  notice-check-cron: "0 */15 * * * *"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

admin:
  token: ${ADMIN_TOKEN:}

discord:
  client-id: ${DISCORD_CLIENT_ID:}
  client-secret: ${DISCORD_CLIENT_SECRET:}
  redirect-uri: ${DISCORD_REDIRECT_URI:http://localhost:8080/api/auth/discord/callback}
  frontend-redirect-url: ${DISCORD_FRONTEND_REDIRECT_URL:http://localhost:3000/my}

jwt:
  secret: ${JWT_SECRET:}
  expiration-hours: 720
