spring:
  application:
    name: loajipsa

server:
  port: 8080

slack:
  bot-token: ${SLACK_BOT_TOKEN}
  channel: ${SLACK_CHANNEL:#로아-숙제-알림}

lostark:
  api-key: ${LOSTARK_API_KEY}
  base-url: https://developer-lostark.game.onstove.com
  price-change-threshold-percent: 5.0
  watch-items:
    - name: "정제된 파괴강석"
      code: 66102005
    - name: "정제된 수호강석"
      code: 66102105

events:
  watched-categories:
    - "모험 섬"
    - "카오스게이트"
    - "필드보스"
    - "항해"
  reminder-minutes-before: 10

schedule:
  homework-reminder-cron: "0 0 6 * * *"
  market-check-cron: "0 */30 * * * *"
  # market-check-cron과 동일한 주기를 초 단위로도 들고 있는다 (프론트 카운트다운용).
  # cron을 바꾸면 이 값도 같이 바꿔야 한다.
  market-check-interval-seconds: 1800
  event-check-cron: "0 * * * * *"

app:
  cors:
    allowed-origins: http://localhost:3000

admin:
  token: ${ADMIN_TOKEN:}
